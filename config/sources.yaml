    - {name: "Nature Machine Intelligence", url: ""}  # 待确认

openreview:
  enabled: false
  venues: ["ICLR", "NeurIPS", "ICML", "MLCB", "RECOMB"]  # 具体 venue id 待确认
  # refresh-openreview（核验并覆盖公开库里的 ICLR 条目）用的官方 API v2 地址与请求间隔（秒，最小按 1 秒）
  api_base_url: "https://api2.openreview.net"
  delay_seconds: 1.0

