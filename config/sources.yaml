openreview:
  enabled: false
  # 对象带 venueid / invitation 才会被抓取；纯字符串仅作占位标签。venueid 待核实。
  venues:
    - {name: "ICLR 2027", venueid: "ICLR.cc/2027/Conference/Submission"}
    - "NeurIPS"
    - "ICML"
    - "MLCB"
    - "RECOMB"
  token_env: "OPENREVIEW_TOKEN"
  page_size: 100
  max_notes_per_venue: 1000
  # refresh-openreview（核验并覆盖公开库里的 ICLR 条目）用的官方 API v2 地址与请求间隔（秒，最小按 1 秒）
  api_base_url: "https://api2.openreview.net"
  delay_seconds: 1.0

