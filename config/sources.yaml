arxiv:
  enabled: true
  base_url: "https://export.arxiv.org/api/query"
  bio_categories: ["q-bio.GN", "q-bio.QM", "q-bio.MN", "q-bio.CB", "q-bio.BM"]  # 全收，本地预筛
  ml_categories: ["cs.LG", "cs.AI", "stat.ML", "cs.CV", "cs.CL", "stat.ME"]  # 查询时必须带关键词
  query_terms:
    - "virtual cell"
    - "perturbation prediction"
    - "single-cell"
    - "Perturb-seq"
    - "gene expression"
    - "cellular response"
    - "drug response"
    - "cell foundation model"
    - "gene regulatory network"
    - "CRISPR screen"
    - "cell fate"
    - "transcriptomic"
    - "scRNA-seq"
    - "spatial transcriptomics"
    - "RNA velocity"
    - "cell state"
    - "flow matching"
    - "cell painting"
    - "multi-omics"
  page_size: 100
  delay_seconds: 3.0
  max_results_per_window: 2000

biorxiv:
  enabled: true
  base_url: "https://api.biorxiv.org"
  server: "biorxiv"
  categories: ["bioinformatics", "systems biology", "genomics", "synthetic biology"]
  delay_seconds: 1.0
  max_pages_per_category: 400
  fetch_published_links: true   # 用 /pubs 端点回填已发表的 DOI 与期刊

medrxiv:
  enabled: false
  base_url: "https://api.biorxiv.org"
  server: "medrxiv"
  categories: ["health informatics", "genetic and genomic medicine"]
  delay_seconds: 1.0
  max_pages_per_category: 400
  fetch_published_links: false

# OpenAlex（CC0 1.0；以下 27 本期刊 ISSN 均于 2026-11-28 核对自 OpenAlex Sources API）
openalex:
  enabled: true
  journal_issns:
    # Nature 系列
    - {name: "Nature", issn: ["0028-0836", "1476-4687"]}
    - {name: "Nature Methods", issn: ["1548-7091", "1548-7105"]}
    - {name: "Nature Biotechnology", issn: ["1087-0156", "1546-1696"]}
    - {name: "Nature Machine Intelligence", issn: ["2522-5839"]}
    - {name: "Nature Computational Science", issn: ["2662-8457"]}
    - {name: "Nature Genetics", issn: ["1061-4036", "1546-1718"]}
    - {name: "Nature Communications", issn: ["2041-1723"]}
    - {name: "Nature Cell Biology", issn: ["1465-7392", "1476-4679"]}
    - {name: "Nature Medicine", issn: ["1078-8956", "1546-170X"]}
    - {name: "npj Systems Biology and Applications", issn: ["2056-7189"]}
    # Cell 系列
    - {name: "Cell", issn: ["0092-8674", "1097-4172"]}
    - {name: "Cell Systems", issn: ["2405-4712", "2405-4720"]}
    - {name: "Cell Genomics", issn: ["2666-979X"]}
    - {name: "Cell Reports", issn: ["2211-1247"]}
    - {name: "Cell Reports Methods", issn: ["2667-2375"]}
    - {name: "Patterns", issn: ["2666-3899"]}
    # Science & 综合顶刊
    - {name: "Science", issn: ["0036-8075", "1095-9203"]}
    - {name: "Science Advances", issn: ["2375-2548"]}
    - {name: "Proceedings of the National Academy of Sciences", issn: ["0027-8424", "1091-6490"]}
    - {name: "eLife", issn: ["2050-084X"]}
    # 生信与系统生物学主力刊
    - {name: "Genome Biology", issn: ["1465-6906", "1474-760X"]}
    - {name: "Molecular Systems Biology", issn: ["1744-4292"]}
    - {name: "Genome Research", issn: ["1088-9051", "1549-5469"]}
    - {name: "Nucleic Acids Research", issn: ["0305-1048", "1362-4962"]}
    - {name: "Bioinformatics", issn: ["1367-4803", "1367-4811"]}
    - {name: "PLOS Computational Biology", issn: ["1553-734X", "1553-7358"]}
    - {name: "Briefings in Bioinformatics", issn: ["1467-5463", "1477-4054"]}
  domain_terms: ["single-cell", "virtual cell", "perturbation", "foundation model", "gene expression", "transcriptomic", "cell state"]
  queries:
    - '"virtual cell"'
    - '"single-cell foundation model"'
    - '"perturbation prediction"'
    - '"Perturb-seq"'
  mailto: ""   # 由使用者填写联系邮箱，可进入 OpenAlex polite pool；仓库中不要提交真实邮箱
  per_page: 100
  delay_seconds: 0.5
  max_pages: 10

# Europe PMC（条款待核实）
europepmc:
  enabled: true
  queries:
    - '"virtual cell"'
    - '"single-cell" AND ("foundation model" OR "deep learning")'
    - '"perturbation prediction"'
    - '"Perturb-seq"'
    - '"cell foundation model"'
  page_size: 100
  delay_seconds: 1.0
  max_pages: 10

