http:
  timeout: 30
  user_agent: "virtual-cell-radar/0.1 (+https://github.com/mxqmxqmxq/virtual-cell-radar)"
  max_retries: 3

seed:
  source_dir: null   # 种子目录，可经 CLI 参数或 AIVC_SEED_DIR 传入
  iclr_md: null
  exclude_dirs: [".venv", "__pycache__", "node_modules", ".git", ".codex_extract"]
  exclude_globs: ["*Agenda*.pdf", "mmc*.pdf"]
