# 知识资源 · 精选清单：数据门户与基准/竞赛（kind=data_portal、benchmark），人工维护
# 字段：id（小写字母数字与连字符，全库唯一）、name、kind、url、description_zh（用自己的话写的可核实事实）、
#       tags、related_tasks / related_paradigms（config/scope.yaml 里的 id）、status（accepted/candidate/archived）、
#       added、source（manual/auto_discovered）、github（owner/repo，url 是仓库地址时可省略）、
#       paper_ids（论文库 id）、dataset_names（对应的数据集名/别名）、discovered_from、note。
# 本文件可能被命令重写（手写注释不会保留），说明请写在 note 字段。

resources:
  - id: cellxgene-discover
    name: CZ CELLxGENE Discover
    kind: data_portal
    url: https://cellxgene.cziscience.com/
    description_zh: Chan Zuckerberg 系列平台提供的单细胞数据集合与在线探索入口，可浏览、下载并在线可视化整理好的单细胞数据集，并附带 Census API 与细胞类型指南等入口。
    tags:
    - 单细胞图谱
    - 数据门户
    - 表达可视化
    related_tasks:
    - cell_state_representation
    - dataset_resource
    related_paradigms:
    - foundation_model_pretraining
    status: accepted
    added: 2026-11-15
    source: manual
    note: 数据许可按各数据集/合集分别标注，待核实。

  - id: scperturb
    name: scPerturb
    kind: data_portal
    url: https://projects.sanderlab.org/scperturb/
    description_zh: 整理并统一格式的单细胞扰动数据集资源，收录带单细胞读数的靶向扰动实验，并提供数据集属性浏览器（扰动类型、扰动数等），原始论文为 bioRxiv 预印本。
    tags:
    - 扰动数据
    - Perturb-seq
    - 标准化数据集
    related_tasks:
    - perturbation_response_prediction
    - benchmark_evaluation
    - dataset_resource
    status: accepted
    added: 2026-11-15
    source: manual
    dataset_names:
    - scPerturb
    note: 站点 scperturb.org 会跳转到该地址；各子数据集许可待核实。

