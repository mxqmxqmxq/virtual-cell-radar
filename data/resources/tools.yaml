# 知识资源 · 精选清单：工具库与软件（kind=tool），人工维护
# 字段：id（小写字母数字与连字符，全库唯一）、name、kind、url、description_zh（用自己的话写的可核实事实）、
#       tags、related_tasks / related_paradigms（config/scope.yaml 里的 id）、status（accepted/candidate/archived）、
#       added、source（manual/auto_discovered）、github（owner/repo，url 是仓库地址时可省略）、
#       paper_ids（论文库 id）、dataset_names（对应的数据集名/别名）、discovered_from、note。
# 本文件可能被命令重写（手写注释不会保留），说明请写在 note 字段。

resources:
  - id: scanpy
    name: scanpy
    kind: tool
    url: https://github.com/scverse/scanpy
    description_zh: 单细胞 RNA-seq 数据分析的 Python 工具包，基于 AnnData，覆盖预处理、降维、聚类与可视化，属于 scverse 生态。
    tags:
    - single-cell
    - preprocessing
    - scverse
    related_tasks:
    - cell_state_representation
    status: accepted
    added: 2026-11-15
    source: manual
    github: scverse/scanpy

  - id: anndata
    name: anndata
    kind: tool
    url: https://github.com/scverse/anndata
    description_zh: 单细胞数据的标准注释矩阵格式与 Python 库（.h5ad），是 scverse 工具与多数细胞模型的通用数据容器。
    tags:
    - data-format
    - single-cell
    - scverse
    related_tasks:
    - cell_state_representation
    status: archived
    added: 2026-11-15
    source: manual
    github: scverse/anndata
    note: 2026-11-15 归档：通用单细胞基础设施，与虚拟细胞主题关系较远。

  - id: scvi-tools
    name: scvi-tools
    kind: tool
    url: https://github.com/scverse/scvi-tools
    description_zh: 基于 PyTorch 的单细胞组学概率模型库（如 scVI、scANVI、totalVI 等），用于整合、批次校正与差异表达，属于 scverse 生态。
    tags:
    - single-cell
    - probabilistic-model
    - scverse
    related_tasks:
    - cell_state_representation
    - multi_omics_integration
    related_paradigms:
    - vae_latent_variable
    status: accepted
    added: 2026-11-15
    source: manual
    github: scverse/scvi-tools

